# ---------------------------------------------------------------------------
# Build system
# ---------------------------------------------------------------------------
[build-system]
requires      = ["hatchling>=1.21"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name            = "clean-order-service"
version         = "0.1.0"
description     = "CreateOrder — Clean Architecture (entities / use cases / controllers / presenters / gateways)"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    {name = "MarcosMarquezOvalle",email = "mmarquez17@gmail.com"}
]

dependencies = [
    "sqlalchemy>=2.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    # testing
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.27",          # async test client for FastAPI
    # linting
    "ruff>=0.4",
    # type checking
    "mypy>=1.9",
    "types-sqlalchemy",
]

# ---------------------------------------------------------------------------
# Hatch: where to find packages
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths  = ["tests"]
addopts    = "--cov=src --cov-report=term-missing --cov-report=xml:coverage.xml"

# ---------------------------------------------------------------------------
# ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]   # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version         = "3.10"
strict                 = true
ignore_missing_imports = true
exclude                = ["tests/"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false