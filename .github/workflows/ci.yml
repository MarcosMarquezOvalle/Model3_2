# =============================================================================
# CI/CD — clean-order-service
#
# Jobs (run in order):
#   lint        → ruff check + ruff format --check
#   type-check  → mypy --strict
#   test        → pytest + coverage (uploads to Codecov)
#   build-wheel → hatch build → uploads .whl artefact
#   docker      → build multi-stage image, push to GHCR
#                 (on main/tags) or push to staging registry (on PRs)
#
# Required repository secrets:
#   (none for GHCR — uses automatic GITHUB_TOKEN)
#
# Optional secrets for an external registry (e.g. Docker Hub):
#   REGISTRY_USERNAME   — registry login
#   REGISTRY_PASSWORD   — registry password / access token
#   REGISTRY            — e.g. "docker.io" or "registry.example.com"
#                         defaults to ghcr.io when not set
# =============================================================================
name: CI/CD

on:
  push:
    branches: ["main", "master"]
    tags:     ["v*.*.*"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Default registry — GitHub Container Registry (no extra secrets needed)
  REGISTRY:    ${{ vars.REGISTRY   || 'ghcr.io' }}
  IMAGE_NAME:  ${{ vars.IMAGE_NAME || github.repository }}

# ---------------------------------------------------------------------------
# Reusable setup composite used by lint / type-check / test
# ---------------------------------------------------------------------------
jobs:

  # ── 1. Lint ──────────────────────────────────────────────────────────────
  lint:
    name: "Lint (ruff)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.4"

      - name: Check style
        run: ruff check src/ tests/

      - name: Check formatting
        run: ruff format --check src/ tests/

  # ── 2. Type-check ────────────────────────────────────────────────────────
  type-check:
    name: "Type-check (mypy)"
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install runtime + type stubs
        run: |
          pip install \
            "sqlalchemy>=2.0" \
            "fastapi>=0.111" \
            "uvicorn[standard]>=0.29" \
            "pydantic>=2.0" \
            "mypy>=1.9" \
            "types-sqlalchemy"

      - name: Run mypy
        run: mypy src/ --explicit-package-bases

  # ── 3. Test ──────────────────────────────────────────────────────────────
  test:
    name: "Test (pytest + coverage)"
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install all dependencies
        run: |
          pip install \
            "sqlalchemy>=2.0" \
            "fastapi>=0.111" \
            "uvicorn[standard]>=0.29" \
            "pydantic>=2.0" \
            "pytest>=7.4" \
            "pytest-cov>=4.1" \
            "httpx>=0.27"

      - name: Run tests
        run: |
          pytest \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v

      - name: Upload coverage report
        if: matrix.python-version == env.PYTHON_VERSION
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false   # don't break CI on Codecov outage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── 4. Build wheel ───────────────────────────────────────────────────────
  build-wheel:
    name: "Build wheel"
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install hatchling
        run: pip install "hatchling>=1.21"

      - name: Build wheel + sdist
        run: python -m hatchling build

      - name: Verify wheel installs cleanly
        run: |
          pip install dist/*.whl
          python -c "import src.entities.order; print('wheel import OK')"

      - name: Upload wheel artefact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ github.sha }}
          path: dist/
          retention-days: 30

      # Publish to PyPI on version tags  (needs PYPI_TOKEN secret)
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

  # ── 5. Docker build & push ───────────────────────────────────────────────
  docker:
    name: "Docker build & push"
    runs-on: ubuntu-latest
    needs: [build-wheel]

    permissions:
      contents: read
      packages: write      # needed to push to GHCR

    steps:
      - uses: actions/checkout@v4

      # Download the wheel built in the previous job so the Docker build can
      # COPY it in if needed (optional; the Dockerfile rebuilds from source).
      - name: Download wheel artefact
        uses: actions/download-artifact@v4
        with:
          name: wheel-${{ github.sha }}
          path: dist/

      - name: Set up QEMU (multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GHCR (default) or an external registry if secrets are set
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      # Compute tags & labels from git metadata
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # semver tag  →  v1.2.3  →  :1.2.3, :1.2, :1, :latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # branch push →  :main, :master
            type=ref,event=branch
            # PR           →  :pr-42
            type=ref,event=pr
            # always add the short SHA
            type=sha,prefix=sha-,format=short

      # Build and push (cache via GitHub Actions Cache API)
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}

      # Print the image digest so it can be used in deployment manifests
      - name: Image digest
        run: echo "Pushed ${{ steps.meta.outputs.tags }}"
